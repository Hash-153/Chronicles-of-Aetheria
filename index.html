<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chronicles of Aetheria - AetherEngine</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #080a0f;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #e2e8f0;
    }
    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #080a0f;
    }
    #canvas-render-target {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
      image-rendering: pixelated;
    }
    #ui-root {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    #debug-hud {
      position: absolute;
      top: 14px;
      left: 14px;
      padding: 10px 14px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 6px;
      font-family: 'Courier New', Courier, monospace;
      font-size: 13px;
      color: #38bdf8;
      pointer-events: auto;
      z-index: 100;
      backdrop-filter: blur(4px);
    }
    .hud-line {
      margin-bottom: 4px;
    }
    .hud-val {
      color: #facc15;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="canvas-render-target"></canvas>
    <div id="ui-root"></div>
    <div id="debug-hud">
      <div class="hud-line">AETHER ENGINE <span class="hud-val">v1.0.0</span></div>
      <div class="hud-line">FPS: <span id="hud-fps" class="hud-val">60</span> | Status: <span class="hud-val">Running</span></div>
      <div class="hud-line">Entities: <span id="hud-entities" class="hud-val">18</span> | Slain: <span id="hud-collisions" class="hud-val">0</span></div>
      <div class="hud-line">Biome: <span id="hud-biome" class="hud-val">Aetherial Highlands</span></div>
      <div class="hud-line">Controls: <span id="hud-mode" class="hud-val">[WASD] Move, [LMB / 1] Cast Fireball, [Space] Roll</span></div>
    </div>
  </div>
  <script src="/public/game.js"></script>
</body>
</html>
